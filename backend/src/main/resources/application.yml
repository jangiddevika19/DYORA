server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dyora-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dyora?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password:  ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_FILE_SIZE:15MB}

dyora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
    provider: ${AI_PROVIDER:openai-compatible}

  upload:
    max-file-size-mb: ${MAX_FILE_SIZE_MB:15}

logging:
  level:
    com.dyora: INFO
    org.springframework.security: WARN