server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: dyora-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/test?sslMode=VERIFY_CA&sslCa=certs/isrgrootx1.pem}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_FILE_SIZE:15MB}

dyora:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    model: ${AI_MODEL:gemini-3.8-flash}
    provider: ${AI_PROVIDER:openai-compatible}

  upload:
    max-file-size-mb: ${MAX_FILE_SIZE_MB:15}

logging:
  level:
    com.dyora: INFO
    org.springframework.security: WARN